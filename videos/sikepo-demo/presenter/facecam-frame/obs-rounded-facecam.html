<!doctype html><html lang="id"><meta charset="utf-8"><title>SIKEPO — Rounded Facecam</title><style>*{box-sizing:border-box}html,body{margin:0;width:1344px;height:784px;background:transparent;overflow:hidden}.frame{position:absolute;left:32px;top:32px;width:1280px;height:720px;border:6px solid #f3f4ef;border-radius:56px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.25);background:#181c19}video{display:block;width:100%;height:100%;object-fit:cover}</style><div class="frame"><video id="presenter" autoplay playsinline src="../final/01-pre-demo-720p.mp4"></video></div><script>const video=document.getElementById('presenter');const clips=['../final/01-pre-demo-720p.mp4','../final/02-demo-720p.mp4','../final/03-after-demo-720p.mp4'];let index=0;video.addEventListener('ended',()=>{if(++index<clips.length){video.src=clips[index];video.play();}});video.addEventListener('click',()=>video.paused?video.play():video.pause());</script></html>
